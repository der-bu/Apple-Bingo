<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Event Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfbfd; --bg2:#f0f0f5; --card:rgba(255,255,255,.72); --card-solid:#ffffff;
    --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.09);
    --accent:#0071e3; --accent2:#38bdf8; --hit:#12a67a; --hit-bg:rgba(18,166,122,.12);
    --win1:#bf5af2; --win2:#0a84ff; --shadow:0 8px 30px rgba(0,0,0,.08);
    --radius:20px; --cell-radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --bg2:#0b0b0f; --card:rgba(28,28,30,.62); --card-solid:#1c1c1e;
      --ink:#f5f5f7; --muted:#98989d; --line:rgba(255,255,255,.10);
      --accent:#0a84ff; --accent2:#64d2ff; --hit:#30d59a; --hit-bg:rgba(48,213,154,.14);
      --shadow:0 8px 34px rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    padding:26px 18px 60px;min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(120,80,255,.14), transparent 60%),
      radial-gradient(1000px 560px at 110% 10%, rgba(10,132,255,.16), transparent 55%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    background-attachment:fixed;
  }
  .wrap{max-width:660px;margin:0 auto;}

  .masthead{text-align:center;margin:6px 0 26px;}
  .logo{font-size:30px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.18));}
  h1{
    font-size:clamp(30px,7vw,46px);font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.02;
    background:linear-gradient(120deg,var(--ink) 20%,var(--win1) 55%,var(--accent) 90%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .tagline{color:var(--muted);font-size:15px;margin:10px 0 0;font-weight:400;}

  .card{
    background:var(--card);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;}
  input{
    width:100%;font-size:16px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;
    background:var(--card-solid);color:var(--ink);margin-bottom:16px;font-family:inherit;transition:border-color .15s,box-shadow .15s;
  }
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(10,132,255,.15);}
  button{
    font-family:inherit;font-size:16px;font-weight:600;padding:14px 22px;border:none;border-radius:13px;
    background:linear-gradient(120deg,var(--accent),var(--win1));color:#fff;cursor:pointer;width:100%;
    transition:transform .12s,box-shadow .2s,opacity .15s;box-shadow:0 6px 20px rgba(10,132,255,.35);
  }
  button:hover{box-shadow:0 8px 26px rgba(120,80,255,.45);}
  button:active{transform:scale(.97);}
  button:disabled{opacity:.55;cursor:default;box-shadow:none;}
  .err{color:#ff453a;font-size:13px;margin:-9px 0 12px;min-height:0;font-weight:500;}

  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:2px;}
  .cell{
    position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:var(--cell-radius);
    background:var(--card-solid);display:flex;align-items:center;justify-content:center;text-align:center;
    padding:7px 6px;font-size:clamp(12px,3.2vw,14.5px);font-weight:600;cursor:pointer;line-height:1.2;letter-spacing:-.015em;
    user-select:none;overflow:hidden;hyphens:auto;overflow-wrap:anywhere;
    transition:transform .16s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s,color .2s,box-shadow .2s;
  }
  .cell:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.10);}
  .cell:active{transform:scale(.92);}
  .cell.hit{
    background:linear-gradient(135deg,var(--hit-bg),transparent);border-color:var(--hit);color:var(--hit);
    box-shadow:inset 0 0 0 1px var(--hit),0 4px 14px rgba(18,166,122,.22);
  }
  .cell.hit::after{
    content:"✓";position:absolute;top:4px;right:5px;font-size:9px;font-weight:800;opacity:.8;
  }
  .cell.pop{animation:pop .42s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.14);}100%{transform:scale(1);}}
  .cell.winline{
    border-color:transparent;color:#fff;
    background:linear-gradient(135deg,var(--win1),var(--win2));
    box-shadow:0 6px 20px rgba(120,80,255,.5);animation:glow 1.6s ease-in-out infinite;
  }
  .cell.winline::after{color:#fff;opacity:1;}
  @keyframes glow{0%,100%{box-shadow:0 6px 20px rgba(120,80,255,.45);}50%{box-shadow:0 8px 30px rgba(10,132,255,.7);}}

  .banner{
    position:relative;overflow:hidden;color:#fff;border-radius:var(--radius);padding:20px 22px;margin-bottom:18px;
    font-size:17px;font-weight:600;display:flex;align-items:center;gap:12px;
    background:linear-gradient(120deg,var(--win1),var(--win2));box-shadow:0 10px 34px rgba(120,80,255,.5);
    animation:bannerIn .5s cubic-bezier(.16,1,.3,1);
  }
  @keyframes bannerIn{from{opacity:0;transform:translateY(-10px) scale(.98);}to{opacity:1;transform:none;}}
  .banner .cup{font-size:26px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3));}
  .banner::before{
    content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);
    transform:translateX(-120%);animation:sheen 2.6s ease-in-out infinite;
  }
  @keyframes sheen{0%{transform:translateX(-120%);}60%,100%{transform:translateX(120%);}}

  .who{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .who .name{font-weight:700;font-size:19px;letter-spacing:-.02em;}
  .who .cnt{color:var(--muted);font-size:13px;font-weight:600;
    background:var(--card-solid);border:1px solid var(--line);padding:5px 11px;border-radius:999px;}

  .board h2{font-size:12px;color:var(--muted);font-weight:700;margin:0 0 12px;text-transform:uppercase;letter-spacing:.06em;}
  .row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:.5px solid var(--line);font-size:15px;}
  .row:last-of-type{border-bottom:none;}
  .row .name{font-weight:500;}
  .row .n{color:var(--muted);font-size:12px;font-weight:600;
    background:var(--bg2);padding:4px 10px;border-radius:999px;border:1px solid var(--line);}
  .row.winner{background:linear-gradient(90deg,rgba(120,80,255,.12),transparent);border-radius:11px;margin:0 -6px;padding-left:10px;padding-right:10px;}
  .row.winner .name{color:var(--win1);font-weight:700;}
  .row.winner .n{background:linear-gradient(120deg,var(--win1),var(--win2));color:#fff;border:none;}

  .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:16px;line-height:1.5;}
  .loading{text-align:center;color:var(--muted);padding:60px 20px;font-size:15px;}
  .status{font-size:11px;text-align:center;margin-top:10px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;}
  .status .dot{width:7px;height:7px;border-radius:50%;background:var(--hit);box-shadow:0 0 8px var(--hit);animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .status.ok{color:var(--hit);}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Connecting…</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, set }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// ---- Firebase configuration ------------------------------------------------
const firebaseConfig = {
  apiKey: "AIzaSyDoeYb42OgKETNxHDNqgb5iQdPWH_akvOM",
  authDomain: "apple-bingo-fedea.firebaseapp.com",
  databaseURL: "https://apple-bingo-fedea-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "apple-bingo-fedea",
  storageBucket: "apple-bingo-fedea.firebasestorage.app",
  messagingSenderId: "218484756850",
  appId: "1:218484756850:web:f633cc3c18ea5ed3cecdeb"
};
const ROOM = "event-2026-09"; // everyone at one watch party shares this room

let db;
try{
  const fbApp = initializeApp(firebaseConfig);
  db = getDatabase(fbApp);
}catch(e){
  document.getElementById("app").innerHTML =
    '<div class="loading">Could not connect to Firebase. Please reload the page.</div>';
}

// ---- Term pool: Apple Event classics + Sept 2026 rumor mill -----------------
const COMMON = [
  "“Incredible”","“Magical”","“The best … ever”","“Only Apple”",
  "“Pro” said 10+ times","New A-series chip","“Our most powerful … ever”","Camera upgrade",
  "“Carbon neutral” / environment","“One word: …”","Craig grins","Ternus says “Good morning”",
  "“We can’t wait”","“Thinner and lighter”","“Available starting …”","New color revealed",
  "“Seamless”","Apple Intelligence","Giant number on a slide","Battery-life claim",
  "“Only on iPhone”","Slow-mo product beauty shot","“Available in the coming weeks”","Aerial shot of Apple Park"
];
const RARE = [
  "“One more thing”","Foldable iPhone Ultra unveiled","“iPhone Ultra” name confirmed","Book-style fold shown",
  "“Virtually crease-free” display","Titanium frame mentioned","Touch ID in power button","A20 Pro chip",
  "First 2-nanometer chip","C2 modem mentioned","12GB of RAM","Variable-aperture camera",
  "Smaller Dynamic Island","No standard iPhone 18 this time","No iPhone Air mentioned","iPhone 18 Pro Max",
  "Price higher than last year","Ultra priced over $2,000","“Limited availability at launch”","Dark cherry color",
  "Apple Watch Series 12","Apple Watch Ultra 4","AirPods 5","New MacBook Pro (M-series)",
  "New iPad shown","Ternus: first keynote as CEO","Tim Cook thanked / mentioned","“Surprise and shine” callback",
  "Standing ovation in a video","Celebrity in the ad reel","Health feature","Satellite feature",
  "Screen-time / privacy slide","“Up to …× faster” comparison","Genmoji / emoji moment","Developer shout-out",
  "Live demo stutters","Recycling robot “Daisy”","New watch face","Accessory pricier than expected",
  "“Available this Friday”","Musical act at the end","Applause for the camera","“This is just the beginning”"
];

// ---- deterministic RNG from email ------------------------------------------
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function buildCard(email){
  const rng=mulberry32(hashStr(email.toLowerCase().trim())||1);
  const pick=(arr,n)=>{const c=[...arr];for(let i=c.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c.slice(0,n);};
  let cells=[...pick(COMMON,8),...pick(RARE,17)];
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]];}
  return cells.slice(0,25);
}

// ---- winning lines (row / column / diagonal, NO free space) ----------------
const LINES=(()=>{const L=[];
  for(let r=0;r<5;r++)L.push([0,1,2,3,4].map(c=>r*5+c));
  for(let c=0;c<5;c++)L.push([0,1,2,3,4].map(r=>r*5+c));
  L.push([0,6,12,18,24]);L.push([4,8,12,16,20]);return L;})();
function winningLine(marks){for(const line of LINES){if(line.every(i=>marks[i]))return line;}return null;}

// ---- Firebase key from email -----------------------------------------------
function keyFor(email){return btoa(unescape(encodeURIComponent(email.toLowerCase().trim())))
  .replace(/[.#$/\[\]=+]/g,"_");}

// ---- State -----------------------------------------------------------------
let me=null, myCard=[], myMarks=Array(25).fill(false), players={}, lastToggled=-1, hadWin=false;

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- confetti burst (winner only) ------------------------------------------
function confetti(){
  const colors=["#bf5af2","#0a84ff","#30d59a","#ff9f0a","#ff375f","#64d2ff"];
  const n=90;
  for(let i=0;i<n;i++){
    const p=document.createElement("div");
    const size=6+Math.random()*8;
    p.style.cssText=`position:fixed;top:-20px;left:${Math.random()*100}vw;width:${size}px;height:${size*0.5}px;
      background:${colors[i%colors.length]};border-radius:2px;z-index:9999;pointer-events:none;
      opacity:.95;transform:rotate(${Math.random()*360}deg);`;
    document.body.appendChild(p);
    const dur=2200+Math.random()*1600, drift=(Math.random()-.5)*260;
    p.animate([
      {transform:`translate(0,0) rotate(0deg)`,opacity:1},
      {transform:`translate(${drift}px,${window.innerHeight+60}px) rotate(${540+Math.random()*540}deg)`,opacity:.9}
    ],{duration:dur,easing:"cubic-bezier(.2,.6,.4,1)"}).onfinish=()=>p.remove();
  }
}

// ---- live subscription -----------------------------------------------------
function subscribe(){
  onValue(ref(db,`rooms/${ROOM}/players`),snap=>{
    players=snap.val()||{};
    if(me)renderGame();
  });
}

// ---- join view -------------------------------------------------------------
function renderJoin(errMsg){
  app.innerHTML=`
    <div class="masthead">
      <div class="logo"></div>
      <h1>Event Bingo</h1>
      <p class="tagline">Surprise &amp; Shine · September 9</p>
    </div>
    <div class="card">
      <label>Nickname</label>
      <input id="nick" maxlength="20" placeholder="e.g. Kevin K." autocomplete="off">
      <label>Email</label>
      <input id="mail" type="email" placeholder="name@company.com" autocomplete="off">
      <div class="err" id="e">${errMsg?esc(errMsg):""}</div>
      <button id="go">Let’s go</button>
    </div>
    <p class="hint">Your card is generated from your email — everyone gets a different mix.</p>`;
  document.getElementById("go").onclick=join;
  document.getElementById("nick").oninput=document.getElementById("mail").oninput=()=>document.getElementById("e").textContent="";
  try{
    const savedMail=localStorage.getItem("apple-bingo-mail");
    const savedNick=localStorage.getItem("apple-bingo-nick");
    if(savedMail)document.getElementById("mail").value=savedMail;
    if(savedNick)document.getElementById("nick").value=savedNick;
  }catch(e){}
}

async function join(){
  const nick=document.getElementById("nick").value.trim();
  const mail=document.getElementById("mail").value.trim();
  if(!nick){document.getElementById("e").textContent="Please enter a nickname.";return;}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){document.getElementById("e").textContent="Please enter a valid email.";return;}
  const btn=document.getElementById("go");btn.disabled=true;btn.textContent="Connecting…";
  const id=keyFor(mail);
  me={id,nick,mail};
  myCard=buildCard(mail);
  const existing=players[id];
  myMarks=(existing&&Array.isArray(existing.marks)&&existing.marks.length===25)?existing.marks:Array(25).fill(false);
  hadWin=!!winningLine(myMarks);
  try{
    localStorage.setItem("apple-bingo-mail",mail);
    localStorage.setItem("apple-bingo-nick",nick);
  }catch(e){}
  await persist();
  renderGame();
}

async function persist(){
  const line=winningLine(myMarks);
  const prev=players[me.id]||{};
  try{
    await set(ref(db,`rooms/${ROOM}/players/${me.id}`),{
      nick:me.nick,
      marks:myMarks,
      count:myMarks.filter(Boolean).length,
      won:!!line,
      wonTs: line ? (prev.wonTs || Date.now()) : null
    });
  }catch(e){}
}

function toggle(i){
  myMarks[i]=!myMarks[i];
  lastToggled=i;
  renderGame();
  persist();
}

function renderGame(){
  const line=winningLine(myMarks);
  const list=Object.entries(players).map(([id,p])=>({id,...p}));
  const winners=list.filter(p=>p.won).sort((a,b)=>(a.wonTs||0)-(b.wonTs||0));
  const board=list.sort((a,b)=>(b.won-a.won)||((a.wonTs||9e15)-(b.wonTs||9e15))||(b.count-a.count));

  // trigger confetti once, when *I* first complete a line
  if(line&&!hadWin){hadWin=true;confetti();}
  if(!line)hadWin=false;

  let bannerHtml="";
  if(winners.length){
    const first=winners[0];
    bannerHtml=`<div class="banner"><span class="cup">🏆</span><span>${esc(first.nick)} got BINGO!${
      first.id===me.id?" That’s you.":""}</span></div>`;
  }

  const cells=myCard.map((t,i)=>{
    const hit=myMarks[i]?"hit":"";
    const winCell=line&&line.includes(i)?"winline":"";
    const pop=(i===lastToggled&&myMarks[i])?"pop":"";
    return `<div class="cell ${hit} ${winCell} ${pop}" data-i="${i}">${esc(t)}</div>`;
  }).join("");
  lastToggled=-1;

  const rows=board.map((p,idx)=>`
    <div class="row ${p.won?"winner":""}">
      <span class="name">${p.won?"🏆 ":""}${esc(p.nick)}${p.id===me.id?" (you)":""}</span>
      <span class="n">${p.won?"BINGO":(p.count||0)+"/25"}</span>
    </div>`).join("");

  app.innerHTML=`
    <div class="masthead">
      <div class="logo"></div>
      <h1>Event Bingo</h1>
      <p class="tagline">Surprise &amp; Shine · September 9</p>
    </div>
    ${bannerHtml}
    <div class="card">
      <div class="who">
        <span class="name">${esc(me.nick)}</span>
        <span class="cnt">${myMarks.filter(Boolean).length}/25 marked</span>
      </div>
      <div class="grid">${cells}</div>
      <p class="hint">Tap a term the moment it happens on stage.</p>
    </div>
    <div class="card board">
      <h2>Who’s playing (${board.length})</h2>
      ${rows||'<p class="hint">Nobody else here yet.</p>'}
      <p class="status ok"><span class="dot"></span>Live connected</p>
    </div>`;

  app.querySelectorAll(".cell").forEach(c=>c.onclick=()=>toggle(+c.dataset.i));
}

// ---- boot ------------------------------------------------------------------
if(db){
  subscribe();
  renderJoin();
}
</script>
</body>
</html>
